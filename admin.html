<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LA SHAUNNIE｜訂單管理後台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4ead9;--surface:#fffdfa;--surface2:#f8f2e9;--text:#191613;--muted:#7b746d;--line:#dfd4c6;--accent:#8f745b;--accentDark:#765b44;--danger:#c93b32;--success:#52745a;--warning:#a06a2d;--shadow:0 16px 45px rgba(61,45,29,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:28px 34px;background:var(--surface);border-top:1px solid #dce2d6;border-bottom:1px solid var(--line)}
.brand{font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-size:30px;letter-spacing:.13em;line-height:1;transform:scaleX(.96);transform-origin:left center}.brand small{display:block;margin-top:8px;font-family:Inter,sans-serif;font-size:9px;font-weight:600;letter-spacing:.34em;color:var(--muted)}
.admin-meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.nav-link{color:var(--accent);text-decoration:none;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:.15s}.nav-link:hover{background:var(--accent);color:#fff;border-color:var(--accent)}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#efe3d1;color:var(--accentDark);font-weight:800}
.page{width:min(1700px,100%);margin:0 auto;padding:24px 18px 40px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.eyebrow{margin:0 0 12px;color:#77706a;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-size:clamp(42px,5vw,68px);font-weight:400;line-height:1;letter-spacing:-.045em}.hero p{margin:14px 0 0;color:var(--muted);font-size:14px}.primary-btn{border:0;border-radius:13px;padding:14px 18px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.primary-btn:hover{background:var(--accentDark)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:rgba(255,253,250,.92);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em}.stat-value{margin-top:8px;font-family:"Bodoni Moda",Didot,serif;font-size:32px;line-height:1}.stat-note{margin-top:8px;color:var(--muted);font-size:11px}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) repeat(3,180px) auto;gap:10px;padding:14px;margin-bottom:16px;background:rgba(255,253,250,.92);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.search,.filter{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);outline:none;padding:0 13px}.search:focus,.filter:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,116,91,.12)}.ghost-btn{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);padding:0 15px;font-weight:650;cursor:pointer}
.table-card{background:rgba(255,253,250,.96);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow:visible}table{width:100%;border-collapse:collapse;table-layout:auto}thead th{position:sticky;top:0;z-index:2;padding:12px 10px;text-align:left;background:#f7f1e8;border-bottom:1px solid var(--line);color:#38312c;font-size:11px;font-weight:800;white-space:nowrap}tbody td{padding:12px 10px;border-bottom:1px solid #eee5dc;vertical-align:middle;font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tbody tr:hover{background:#fcf8f3}.order-id{font-weight:800;white-space:nowrap}.customer-wrap{display:flex;justify-content:center}.customer{display:inline-flex;align-items:center;gap:8px;min-width:160px;text-align:left}.customer-avatar{width:28px;height:28px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#efe3d1;color:var(--accentDark);font-weight:800;font-size:11px}.customer-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-sub{margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.money{font-weight:800;white-space:nowrap}.screenshot{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#f4eee7;display:grid;place-items:center;color:var(--muted);font-size:9px;text-align:center;overflow:hidden;cursor:pointer;flex:0 0 auto}.screenshot img{width:100%;height:100%;object-fit:cover}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.pending{background:#fff4dd;color:var(--warning)}.verified{background:#eaf4ec;color:var(--success)}.unpaid{background:#fdecea;color:var(--danger)}.select-status{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font-size:11px;font-weight:650}.ship-btn,.pay-btn{border:1px solid var(--line);border-radius:9px;padding:6px 13px;background:#f4eee7;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.04em;line-height:1.4;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;vertical-align:middle}.ship-btn:hover:not(:disabled),.pay-btn:hover:not(:disabled){background:var(--success);color:#fff;border-color:var(--success)}.ship-btn-done,.pay-btn-done{background:#eaf4ec;color:var(--success);border:1px solid #b9d8c0;cursor:not-allowed}.track-input{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font-size:11px;font-weight:650;font-family:"SF Mono",Menlo,monospace;outline:none;min-width:120px}.track-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(143,116,91,.12)}.note{color:#625a53;line-height:1.4;max-width:160px;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:5px;flex:0 0 auto}.icon-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px}.footer-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--muted);font-size:12px}
th.col-id{width:130px}th.col-date{width:90px}th.col-customer{width:170px}th.col-tg{width:110px}th.col-phone{width:110px}th.col-addr{width:140px}th.col-qty{width:60px}th.col-amount{width:80px}th.col-acct{width:70px}th.col-shot{width:50px}th.col-pay{width:90px}th.col-ship{width:120px}th.col-track{width:140px}th.col-act{width:80px}tbody td{text-align:center}td.col-pay>*,td.col-ship>*,td.col-track>*{display:inline-block}
td.col-id{font-family:"SF Mono",Menlo,monospace;font-size:11px}
.banner{position:fixed;top:18px;right:18px;z-index:50;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:650;box-shadow:0 12px 32px rgba(60,42,26,.18);max-width:360px}.banner.error{background:#fdecea;color:var(--danger);border:1px solid #ffd3cf}.banner.loading{background:#fff4dd;color:var(--warning);border:1px solid #ffe5b8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50}.modal.open{display:flex}.modal-content{background:#fff;border-radius:20px;padding:24px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;gap:14px}.modal-content img{max-width:80vw;max-height:70vh;object-fit:contain;border-radius:12px}.modal-close{border:0;background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700;align-self:flex-end}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}@media(max-width:620px){.topbar{padding:22px 18px}.brand{font-size:23px}.admin-meta span{display:none}.page{padding:24px 12px 35px}.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}}

body{font-family:"Inter","PingFang TC","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
h1{font-family:"Bodoni Moda","Songti TC","Noto Serif TC","PMingLiU",Georgia,serif}
</style>
</head>
<body>
<div id="banner" class="banner loading" style="display:none">載入中…</div>
<header class="topbar"><div class="brand">LA SHAUNNIE<small>訂單管理</small></div><div class="admin-meta"><a href="index.html" class="nav-link">首頁</a><a href="order.html" class="nav-link">訂購頁面</a></div></header>
<main class="page">
<section class="hero"><div><p class="eyebrow">睫毛精華訂單</p><h1>訂單管理</h1><p>查看顧客資料、核對付款並更新配送進度。</p></div><button class="primary-btn" onclick="exportOrders()">匯出訂單</button></section>
<section class="stats">
  <article class="stat"><div class="stat-label">訂單總數</div><div class="stat-value" id="statTotal">–</div><div class="stat-note">目前所有訂單紀錄</div></article>
  <article class="stat"><div class="stat-label">待核對付款</div><div class="stat-value" id="statPending">–</div><div class="stat-note">已提供截圖，等待核對</div></article>
  <article class="stat"><div class="stat-label">待安排出貨</div><div class="stat-value" id="statReady">–</div><div class="stat-note">已付款、尚未出貨</div></article>
  <article class="stat"><div class="stat-label">已確認營收</div><div class="stat-value" id="statRevenue">–</div><div class="stat-note">僅統計已確認付款</div></article>
</section>
<section class="toolbar">
  <input id="searchInput" class="search" type="search" placeholder="搜尋訂單、顧客、電話或 Telegram ID">
  <select id="paymentFilter" class="filter"><option value="">全部付款狀態</option><option value="已付款">已付款</option><option value="未付款">未付款</option></select>
  <select id="shippingFilter" class="filter"><option value="">全部出貨狀態</option><option value="待出貨">待出貨</option><option value="已出貨">已出貨</option><option value="未出貨">未出貨</option></select>
  <select id="quantityFilter" class="filter"><option value="">全部購買數量</option><option value="1">1 瓶</option><option value="2">2 瓶以上</option></select>
  <button class="ghost-btn" onclick="resetFilters()">重設篩選</button>
</section>
<section class="table-card"><div class="table-wrap"><table><thead><tr><th class="col-id">訂單編號</th><th class="col-date">訂購日期</th><th class="col-customer">顧客</th><th class="col-tg">TG 使用者 ID</th><th class="col-phone">電話</th><th class="col-addr">地址</th><th class="col-qty">數量</th><th class="col-amount">金額</th><th class="col-acct">帳號末四碼</th><th class="col-pay">付款狀態</th><th class="col-track">物流單號</th><th class="col-ship">配送狀態</th></tr></thead><tbody id="ordersBody"></tbody></table></div><div class="footer-row"><span id="resultCount">載入中…</span></div></section>
</main>
<div class="modal" id="shotModal" onclick="closeModal(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal(event)">關閉</button>
    <img id="shotImg" alt="付款截圖">
  </div>
</div>
<script>
// Admin TG ID — set here. In production, prompt on first visit.
const ADMIN_TG_ID = 6764901662;
let ALL_ORDERS = [];

const $ = (id) => document.getElementById(id);

function showBanner(msg, kind) {
  const b = $("banner");
  b.textContent = msg;
  b.className = "banner " + (kind || "loading");
  b.style.display = "block";
}
function hideBanner() { $("banner").style.display = "none"; }

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const date = d.toLocaleDateString("zh-TW", { month: "short", day: "numeric", year: "numeric" });
  const time = d.toLocaleTimeString("zh-TW", { hour: "numeric", minute: "2-digit" });
  return { date, time };
}

function initials(name) {
  if (!name) return "??";
  return name.split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

function badge(payment) {
  if (payment === "已付款") return '<span class="badge verified">已付款</span>';
  if (payment === "未付款") return '<span class="badge unpaid">未付款</span>';
  return '<span class="badge pending">—</span>';
}

function escapeHTML(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function screenshotCell(o) {
  if (!o.screenshot_url) {
    return '<div class="screenshot">無<br>圖片</div>';
  }
  return `<div class="screenshot" onclick="openModal('${escapeHTML(o.screenshot_url)}')">
    <img src="${escapeHTML(o.screenshot_url)}" alt="付款憑證" loading="lazy">
  </div>`;
}

function shortNote(notes) {
  if (!notes) return "";
  // Show only the first sentence (or up to 40 chars) for table view
  const first = notes.split(/[。\n]/)[0];
  return first.length > 40 ? first.slice(0, 40) + "…" : first;
}

function rowHTML(o) {
  const dt = fmtDate(o.order_date);
  return `
<tr data-payment="${escapeHTML(o.payment_status)}" data-shipping="${escapeHTML(o.shipping_status)}" data-quantity="${o.quantity}">
  <td class="col-id order-id" title="${escapeHTML(o.order_id)}">${escapeHTML(o.order_id)}</td>
  <td class="col-date">${escapeHTML(dt.date)}<br><span class="customer-sub">${escapeHTML(dt.time)}</span></td>
  <td class="col-customer"><div class="customer-wrap"><div class="customer">
    <div class="customer-avatar">${escapeHTML(initials(o.customer_name))}</div>
    <div><div class="customer-name" title="${escapeHTML(o.customer_name || '')}">${escapeHTML(o.customer_name || "—")}</div>
    <div class="customer-sub">${o.tracking_number ? "已填物流單號" : "待處理"}</div></div>
  </div></div></td>
  <td class="col-tg">@${escapeHTML(String(o.tg_user_id || "—"))}</td>
  <td class="col-phone" title="${escapeHTML(o.customer_phone || '')}">${escapeHTML(o.customer_phone || "—")}</td>
  <td class="col-addr" title="${escapeHTML(o.customer_address || '')}">${escapeHTML(o.customer_address || "—")}</td>
  <td class="col-qty"><strong>${o.quantity}</strong></td>
  <td class="col-amount money">$${Number(o.amount || 0).toFixed(2)}</td>
  <td class="col-acct" title="銀行帳號末四碼">${escapeHTML(o.account4 || "—")}</td>
  <td class="col-pay">
    ${o.payment_status === "已付款"
      ? `<button class="pay-btn pay-btn-done" disabled>✓ 已付款</button>`
      : `<button class="pay-btn" onclick="onPayClick('${escapeHTML(o.id)}', this)">確認付款</button>`}
  </td>
  <td class="col-track"><input class="track-input" type="text" placeholder="物流單號" value="${escapeHTML(o.tracking_number || '')}" onblur="saveTracking('${escapeHTML(o.id)}', this.value)" ${o.shipping_status === '已出貨' ? 'disabled' : ''}></td>
  <td class="col-ship">
    ${o.shipping_status === "已出貨"
      ? `<button class="ship-btn ship-btn-done" disabled>✓ 已出貨</button>`
      : `<button class="ship-btn" onclick="onShipClick('${escapeHTML(o.id)}', this)">標記已出貨</button>`}
  </td>
</tr>`;
}

function renderTable() {
  const tb = $("ordersBody");
  tb.innerHTML = ALL_ORDERS.map(rowHTML).join("");
  filterRows();
  renderStats();
}

function renderStats() {
  const total = ALL_ORDERS.length;
  const paid = ALL_ORDERS.filter(o => o.payment_status === "已付款").length;
  const pending = ALL_ORDERS.filter(o => o.payment_status === "未付款" && o.has_screenshot).length;
  const ready = ALL_ORDERS.filter(o => o.payment_status === "已付款" && o.shipping_status === "待出貨").length;
  const revenue = ALL_ORDERS
    .filter(o => o.payment_status === "已付款")
    .reduce((s, o) => s + Number(o.amount || 0), 0);
  $("statTotal").textContent = total;
  $("statPending").textContent = pending;
  $("statReady").textContent = ready;
  $("statRevenue").textContent = "$" + revenue.toFixed(0);
}

function filterRows() {
  const s = $("searchInput").value.trim().toLowerCase();
  const p = $("paymentFilter").value;
  const sh = $("shippingFilter").value;
  const q = $("quantityFilter").value;
  let v = 0;
  document.querySelectorAll("#ordersBody tr").forEach(r => {
    const ok = (!s || r.innerText.toLowerCase().includes(s))
      && (!p || r.dataset.payment === p)
      && (!sh || r.dataset.shipping === sh)
      && (!q || (q === "1" && +r.dataset.quantity === 1) || (q === "2" && +r.dataset.quantity >= 2));
    r.style.display = ok ? "" : "none";
    if (ok) v++;
  });
  $("resultCount").textContent = `顯示 ${v} 筆訂單`;
}

function resetFilters() {
  $("searchInput").value = "";
  $("paymentFilter").value = "";
  $("shippingFilter").value = "";
  $("quantityFilter").value = "";
  filterRows();
}

async function onPayClick(recId, btn) {
  await patchOrder(recId, { payment_status: "已付款" });
}
async function onShipClick(recId, btn) {
  const row = btn.closest("tr");
  const trackInput = row.querySelector(".track-input");
  const tracking = (trackInput.value || "").trim();
  if (!tracking) {
    trackInput.focus();
    showBanner("請先填寫物流單號。", "error");
    return;
  }
  await patchOrder(recId, { shipping_status: "已出貨", tracking_number: tracking });
}
async function saveTracking(recId, value) {
  const v = (value || "").trim();
  await patchOrder(recId, { tracking_number: v });
}
async function patchOrder(recId, body) {
  showBanner("儲存中…");
  try {
    const res = await fetch(`/api/admin/orders?id=${encodeURIComponent(recId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-Telegram-User-Id": String(ADMIN_TG_ID) },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      showBanner("更新失敗：" + (e.error || res.status), "error");
      return;
    }
    // update local copy
    const o = ALL_ORDERS.find(x => x.id === recId);
    if (o) {
      if ("payment_status" in body) o.payment_status = body.payment_status;
      if ("shipping_status" in body) o.shipping_status = body.shipping_status;
      if ("tracking_number" in body) o.tracking_number = body.tracking_number;
      if ("account4" in body) o.account4 = body.account4;
    }
    renderTable();
    hideBanner();
  } catch (e) {
    showBanner("錯誤：" + e.message, "error");
  }
}

function openModal(url) {
  $("shotImg").src = url;
  $("shotModal").classList.add("open");
}
function closeModal(ev) {
  if (ev.target.id === "shotModal" || ev.target.classList.contains("modal-close")) {
    $("shotModal").classList.remove("open");
  }
}

function exportOrders() {
  const visible = [...document.querySelectorAll("#ordersBody tr")].filter(r => r.style.display !== "none");
  const head = ["訂單編號", "訂購日期", "顧客", "TG 使用者 ID", "電話", "地址", "數量", "金額", "付款狀態", "配送狀態", "備註"];
  const out = [head.join(",")];
  visible.forEach(r => {
    const c = [...r.querySelectorAll("td")];
    const vals = [
      c[0].innerText, c[1].innerText.replace(/\n/g, " "), c[2].innerText.replace(/\n/g, " "),
      c[3].innerText, c[4].innerText, c[5].innerText, c[6].innerText, c[7].innerText,
      c[9].innerText, c[10].querySelector("select").value, c[11].innerText,
    ].map(x => '"' + String(x).replace(/"/g, '""') + '"');
    out.push(vals.join(","));
  });
  const b = new Blob(["\uFEFF" + out.join("\n")], { type: "text/csv;charset=utf-8" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u;
  a.download = "la-shaunnie-orders.csv";
  a.click();
  URL.revokeObjectURL(u);
}

async function loadOrders() {
  showBanner("正在從 Airtable 讀取訂單…");
  try {
    const res = await fetch("/api/admin/orders?stats=1", {
      headers: { "X-Telegram-User-Id": String(ADMIN_TG_ID) },
    });
    if (!res.ok) {
      showBanner("API 錯誤：HTTP " + res.status, "error");
      return;
    }
    const data = await res.json();
    ALL_ORDERS = data.orders || [];
    renderTable();
    hideBanner();
  } catch (e) {
    showBanner("網路錯誤：" + e.message, "error");
  }
}

["searchInput", "paymentFilter", "shippingFilter", "quantityFilter"].forEach(id => {
  $(id).addEventListener("input", filterRows);
  $(id).addEventListener("change", filterRows);
});

loadOrders();
setInterval(loadOrders, 30000);  // auto-refresh every 30s
</script>
</body>
</html>
